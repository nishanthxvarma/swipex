databases:
  - name: swipex-db
    databaseName: swipex
    user: swipex
    plan: free

services:
  - type: web
    name: swipex-backend
    env: docker
    dockerContext: apps/backend
    dockerfilePath: apps/backend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: swipex-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: swipex-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
